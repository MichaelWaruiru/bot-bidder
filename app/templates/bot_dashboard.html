<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Bot Dashboard</title>
</head>
<body>
    <h1>Bot Dashboard</h1>

    <!-- Activate Bot Form -->
    <button onclick="activateBot()">Activate Bot</button>

    <!-- Bot Status -->
    <p id="botStatus"></p>

    <script>
        const API_BASE_URL = "http://127.0.0.1:5000/api/bot";

        // Activate bot (using session authentication)
        async function activateBot() {
            try {
                const response = await fetch(`${API_BASE_URL}/activate`, {
                    method: 'POST',
                    credentials: "include", // Use cookies for authentication
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                alert(data.msg);
                checkBotStatus(); // Refresh status after activation
            } catch (error) {
                console.error("Error activating bot:", error);
            }
        }

        // Check bot status (using cookies)
        async function checkBotStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/status`, {
                    method: 'GET',
                    credentials: "include" // Use session authentication via cookies
                });
                const data = await response.json();
                document.getElementById('botStatus').innerText = `Bot Status: ${data.bot_active ? "Active" : "Inactive"}`;
            } catch (error) {
                console.error("Error checking bot status:", error);
            }
        }

        // Check bot status when the page loads
        checkBotStatus();
    </script>
</body>
</html>
