<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; }
        .message { padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .success { background-color: hsl(134, 41%, 88%); color: #155724; }
        .danger { background-color: hsl(355, 70%, 91%); color: hsl(354, 61%, 28%); }
    </style>
</head>
<body>
    <h2>Login</h2>

    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form action="/api/auth/login" method="POST">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <br>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        <p>Don't have an account? <a href="/api/auth/register">Register here</a></p>
    </div>
</body>
</html>
